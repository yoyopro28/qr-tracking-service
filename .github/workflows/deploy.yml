name: Deploy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Zielumgebung
        required: true
        type: choice
        default: production
        options:
          - production
          - preview
      scope:
        description: Zu deployender Bereich
        required: true
        type: choice
        default: all
        options:
          - all
          - admin
          - backend

concurrency:
  group: qr-tracking-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_SCOPE: ${{ inputs.scope }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
      CLOUDFLARE_ANALYTICS_DATASET: ${{ vars.CLOUDFLARE_ANALYTICS_DATASET }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TRACKING_ORIGIN: ${{ vars.VITE_TRACKING_ORIGIN }}
      VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      ROLLUP_CRON_SECRET: ${{ secrets.ROLLUP_CRON_SECRET }}
      MAINTENANCE_CRON_SECRET: ${{ secrets.MAINTENANCE_CRON_SECRET }}
      CACHE_SYNC_URL: ${{ vars.CACHE_SYNC_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      REDIRECT_URL: ${{ vars.VITE_TRACKING_ORIGIN }}
      SMOKE_REDIRECT_SLUG: ${{ vars.SMOKE_REDIRECT_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:validate

      - name: Apply Supabase migrations
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Configure Edge Function secrets
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: >-
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF"
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          CLOUDFLARE_ANALYTICS_READ_TOKEN="$CLOUDFLARE_ANALYTICS_READ_TOKEN"
          CLOUDFLARE_ANALYTICS_DATASET="$CLOUDFLARE_ANALYTICS_DATASET"
          ROLLUP_CRON_SECRET="$ROLLUP_CRON_SECRET"
          MAINTENANCE_CRON_SECRET="$MAINTENANCE_CRON_SECRET"
      - name: Deploy Supabase Edge Functions
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: npx supabase functions deploy finalize-flyer-batch analytics-query rollup-scan-analytics cleanup-stale-reservations --project-ref "$SUPABASE_PROJECT_REF"
      - name: Configure Worker secrets
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: npm run deploy:configure-workers
      - name: Deploy cache-sync Worker
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: npx wrangler deploy --config workers/cache-sync/wrangler.jsonc --env "$DEPLOY_ENV"
      - name: Deploy redirect Worker
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: npx wrangler deploy --config workers/redirect/wrangler.jsonc --env "$DEPLOY_ENV"
      - name: Configure runtime integrations
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: npm run deploy:configure-runtime
      - name: Reconcile redirect cache
        if: inputs.scope == 'all' || inputs.scope == 'backend'
        run: npm run cache:reconcile

      - name: Build admin SPA
        if: inputs.scope == 'all' || inputs.scope == 'admin'
        run: |
          npm run build
          npm run build:check
      - name: Deploy admin SPA
        if: inputs.scope == 'all' || inputs.scope == 'admin'
        run: npx wrangler deploy --env "$DEPLOY_ENV"

      - name: Smoke-test deployment
        run: npm run deploy:smoke
