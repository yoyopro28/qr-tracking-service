name: CI

permissions:
  contents: read

concurrency:
  group: qr-tracking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
  push:
    branches: [main, refactor/cloudflare-browser-pdf]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only
          VITE_TRACKING_ORIGIN: https://qr.example.com
      - run: npm run build:check
      - run: npm run worker:check
      - run: npm run worker:dry-run

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run supabase:lint
      - run: npx supabase test db
      - name: Export local Supabase settings
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_TRACKING_ORIGIN=http://127.0.0.1:8787" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/cloudflare-browser-pdf'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run deploy:validate
        env: { DEPLOY_ENV: preview }
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Configure Edge Function secrets
        run: >-
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF"
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          CLOUDFLARE_ANALYTICS_READ_TOKEN="$CLOUDFLARE_ANALYTICS_READ_TOKEN"
          CLOUDFLARE_ANALYTICS_DATASET="$CLOUDFLARE_ANALYTICS_DATASET"
          ROLLUP_CRON_SECRET="$ROLLUP_CRON_SECRET"
          MAINTENANCE_CRON_SECRET="$MAINTENANCE_CRON_SECRET"
      - run: npx supabase functions deploy finalize-flyer-batch analytics-query rollup-scan-analytics cleanup-stale-reservations
      - run: npm run deploy:configure-workers
      - run: npx wrangler deploy --config workers/cache-sync/wrangler.jsonc --env preview
      - run: npx wrangler deploy --config workers/redirect/wrangler.jsonc --env preview
      - run: npm run deploy:configure-runtime
      - run: npm run cache:reconcile
      - run: npm run build
      - run: npm run build:check
      - run: npx wrangler deploy --env preview
      - run: npm run deploy:smoke
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
      CLOUDFLARE_ANALYTICS_DATASET: ${{ vars.CLOUDFLARE_ANALYTICS_DATASET }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TRACKING_ORIGIN: ${{ vars.VITE_TRACKING_ORIGIN }}
      VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      ROLLUP_CRON_SECRET: ${{ secrets.ROLLUP_CRON_SECRET }}
      MAINTENANCE_CRON_SECRET: ${{ secrets.MAINTENANCE_CRON_SECRET }}
      CACHE_SYNC_URL: ${{ vars.CACHE_SYNC_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      REDIRECT_URL: ${{ vars.VITE_TRACKING_ORIGIN }}
      SMOKE_REDIRECT_SLUG: ${{ vars.SMOKE_REDIRECT_SLUG }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run deploy:validate
        env: { DEPLOY_ENV: production }
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Configure Edge Function secrets
        run: >-
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF"
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          CLOUDFLARE_ANALYTICS_READ_TOKEN="$CLOUDFLARE_ANALYTICS_READ_TOKEN"
          CLOUDFLARE_ANALYTICS_DATASET="$CLOUDFLARE_ANALYTICS_DATASET"
          ROLLUP_CRON_SECRET="$ROLLUP_CRON_SECRET"
          MAINTENANCE_CRON_SECRET="$MAINTENANCE_CRON_SECRET"
      - run: npx supabase functions deploy finalize-flyer-batch analytics-query rollup-scan-analytics cleanup-stale-reservations
      - run: npm run deploy:configure-workers
      - run: npx wrangler deploy --config workers/cache-sync/wrangler.jsonc --env production
      - run: npx wrangler deploy --config workers/redirect/wrangler.jsonc --env production
      - run: npm run deploy:configure-runtime
      - run: npm run cache:reconcile
      - run: npm run build
      - run: npm run build:check
      - run: npx wrangler deploy --env production
      - run: npm run deploy:smoke
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
      CLOUDFLARE_ANALYTICS_DATASET: ${{ vars.CLOUDFLARE_ANALYTICS_DATASET }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TRACKING_ORIGIN: ${{ vars.VITE_TRACKING_ORIGIN }}
      VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      ROLLUP_CRON_SECRET: ${{ secrets.ROLLUP_CRON_SECRET }}
      MAINTENANCE_CRON_SECRET: ${{ secrets.MAINTENANCE_CRON_SECRET }}
      CACHE_SYNC_URL: ${{ vars.CACHE_SYNC_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      REDIRECT_URL: ${{ vars.VITE_TRACKING_ORIGIN }}
      SMOKE_REDIRECT_SLUG: ${{ vars.SMOKE_REDIRECT_SLUG }}
