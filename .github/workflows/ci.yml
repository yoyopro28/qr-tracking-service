name: CI

permissions:
  contents: read

concurrency:
  group: qr-tracking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_check:
        description: Supabase-, SQL-, Browser- und Wrangler-Integrationstests ausführen
        required: true
        type: boolean
        default: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only
          VITE_TRACKING_ORIGIN: https://qr.example.com
      - run: npm run build:check
      - run: npm run worker:check
      - name: Dry-run Worker bundles
        if: github.event_name == 'workflow_dispatch' && inputs.full_check
        run: npm run worker:dry-run

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.full_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run supabase:lint
      - run: npx supabase test db
      - name: Export local Supabase settings
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_TRACKING_ORIGIN=http://127.0.0.1:8787" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
